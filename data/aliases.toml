# The alias table: canonical AM5 entities and the ways a transcript spells them.
#
# THIS IS A STARTING POINT, NOT A COMPLETE LIST. It was seeded from what an AM5
# motherboard discussion is likely to name, not from the corpus, so it is
# expected to be missing boards, families, and spellings that actually appear.
# Run `find-best-mobo aliases --check` to see which canonicals never matched
# anything and which surface forms carried the weight, then extend this file —
# it is data precisely so that it can be edited without touching code.
#
# Each entry is one canonical entity:
#
#   [[alias]]
#   canonical = "X670E"        # printed in reports; free-form text
#   kind = "chipset"           # board | family | chipset | cpu | vendor
#   surface_forms = ["x670e"]  # what to look for, normalized before matching
#
# Surface forms are passed through `normalize` before they enter the matcher, so
# the mangled spacing an auto-caption produces — `x 670 e`, `x-670-e`, `x 6 70 e`
# — already folds onto `x670e` and does not need its own entry. Variants that do
# NOT fold that way are the ones worth listing: `m s i` for MSI, `tai chi` for
# Taichi, plural and shortened family names.
#
# Bare three-digit forms (`670`, `850`) are deliberately absent: they match
# prices, temperatures, and wattages. The `670e`-style forms are kept because the
# trailing E makes them distinctive.

# --- Chipsets -----------------------------------------------------------------

[[alias]]
canonical = "X870E"
kind = "chipset"
surface_forms = ["x870e", "x 870 e", "870e", "x870 e"]

[[alias]]
canonical = "X870"
kind = "chipset"
surface_forms = ["x870", "x 870"]

