[project]
name = "find-best-mobo"
version = "0.1.0"
description = "Searching Buildzoid videos on YT to extract his top pick for an AMD mobo."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "yt-dlp>=2026.7.4",
]

[project.scripts]
find-best-mobo = "find_best_mobo.cli:main"

[dependency-groups]
# Keep ruff in step with the rev in .pre-commit-config.yaml.
dev = [
    "mypy~=2.3",
    "pre-commit~=4.0",
    "pytest>=8.3",
    "ruff~=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_best_mobo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
