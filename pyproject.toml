[project]
name = "find_best_mobo"
version = "0.1.0"
description = "Searching Buildzoid videos on YT to extract his top pick for an AMD mobo."
readme = "README.md"
requires-python = ">=3.12"
# No `license` field, by design — see "Licensing" in AGENTS.md.
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_best_mobo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
