name: Auto-merge

# Mechanically arms GitHub native auto-merge on each PR. This does NOT decide to
# merge: it enables auto-merge, and GitHub completes the merge only once ALL
# required checks pass (CI hard gate + the review soft gate) and any required
# CODEOWNERS review on gate paths is satisfied. No agent runs `gh pr merge` on
# its own judgment — the merge is triggered by checks going green.
#
# Requires (human, once): "Allow auto-merge" enabled on the repo, and branch
# protection on the default branch with the required status checks configured.
# See the README's manual-setup section.
#
# WHICH IDENTITY ARMS THE MERGE, AND WHY IT IS NOT COSMETIC.
#
# GitHub does not create workflow runs from events caused by the built-in
# GITHUB_TOKEN. That guard exists to stop a workflow triggering itself, and it
# is correct — but it means an auto-merge armed with GITHUB_TOKEN completes as
# `github-actions[bot]` and the resulting `pull_request: closed` event
# DISPATCHES NOTHING. Observed downstream: two pull requests merged by
# auto-merge, both with the delete job present and wired, and no workflow run
# created for either close. The job was never skipped — it was never reached.
#
# Two identities, tried in order (see docs/DECISIONS.md, "Unattended runs
# act as a GitHub App"). Deliberately NO PAT anywhere in this file: a PAT
# expires, shares the owner's rate budget, and acts as the owner — every
# property the App exists to avoid — and a fallback that must be set up
# defeats the point of having fewer things to set up (the owner's ruling).
#
#   1. The GITHUB APP (APP_ID + APP_PRIVATE_KEY secrets; scripts/setup-github.sh
#      --app sets it up). A short-lived token is minted per run. The App has its
#      OWN hourly rate-limit budget, its events fire workflows, so the close
#      event dispatches and cleanup is immediate, and its merges are authored
#      as the app rather than as the owner, which keeps "opened by the owner"
#      (owner-authored.sh) meaning exactly that.
#   2. GITHUB_TOKEN. Everything still merges — only the cleanup goes quiet,
#      which is what the scheduled sweep below exists to cover.
#
# UNVERIFIED, honestly: the App path has not yet been observed completing the
# full cycle (merge → close event → branch gone) on a live repository. ESC-21
# records three prior branch-deletion fixes that were confidently asserted and
# wrong; this one is not done when the workflow looks right, it is done when a
# branch has been seen to vanish.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  # The sweep below. Scheduled runs are NOT suppressed by the GITHUB_TOKEN rule,
  # which is precisely why the cleanup has a second path that does not depend on
  # the token being configured.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  arm-auto-merge:
    # Two conditions, and the second one matters more than it looks.
    #
    # Draft PRs are not armed; mark ready for review to opt in.
    #
    # Only PRs from a branch IN THIS REPOSITORY are armed. Required approvals is
    # 0 by design (see the README), so arming a fork's pull request would mean
    # any outside contributor's change merges the moment checks go green, with
    # nobody having read it. Today fork PRs happen to fail the review gate
    # anyway — secrets are not exposed to them, so the credential is missing and
    # the job fails closed — but that is an accident of how GitHub scopes
    # secrets, not a policy, and it would silently stop protecting anything the
    # day the review gate learned to run without one.
    #
    # This also covers bot PRs from forks. A dependency bot pushing to a branch
    # in this repository IS still armed: that is the intended behaviour for a
    # repo that opted into auto-merge, and the review gate and CI still gate it.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # 10, not 5: the retry ladder below can spend ~4 minutes asleep before its
    # last attempt, and a timeout that kills the job mid-ladder turns "waited
    # out a rate limit" back into "failed the check".
    timeout-minutes: 10
    # The secrets context is NOT available in ANY `if:` — not job level, not step
    # level. A workflow that references it there does not skip a step: the FILE
    # FAILS VALIDATION, the run is created with zero jobs, and every job in the
    # file dies with it, including the two below that have nothing to do with the
    # App. That is ESC-36, and the reason it survived review is that the comment
    # which used to sit here stated a wrong rule confidently: it claimed a step
    # `if:` was being used precisely BECAUSE a job one cannot read secrets. So
    # the line read as a deliberate workaround rather than as a mistake.
    #
    # Secrets ARE allowed in `env:`, and the `env` context IS available in a step
    # `if:`. So the value is hoisted here and the step tests the hoisted copy.
    # Same behaviour, valid file.
    env:
      APP_ID: ${{ secrets.APP_ID }}
    steps:
      - name: Mint the App token
        # Skipped in repositories where the App is not configured; the arming
        # step's token fallback chain handles both outcomes.
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Enable auto-merge (merge commit)
        # Merge commit (not squash): it preserves the exact commits CI tested and
        # the audit trail of what each agent did — worth more here than a flat
        # history, since nothing is human-reviewed before it lands. Reverting a
        # bad PR is still one line: `git revert -m 1 <merge-sha>` (see README).
        # Needs "Allow merge commits" enabled on the repo (the default).
        #
        # NOTE: --delete-branch does NOT survive --auto, and the branch cleanup
        # lives in the job below instead. See the comment there — it was tried
        # here first and silently did nothing.
        env:
          # The identity ladder from the header: App token when the mint step
          # ran, the built-in token otherwise. With GITHUB_TOKEN the merge
          # dispatches no events, so nothing cleans up after it until the
          # scheduled sweep runs.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # --delete-branch is NOT redundant with the repository's "Automatically
        # delete head branches" setting, and this is the part that surprises.
        # That setting is what the merge UI pre-fills for a human; an auto-merge
        # armed through the API records its own merge method AND its own
        # delete-branch choice, and THAT is what GitHub honours when the checks
        # finally go green. Omitting the flag records "do not delete", so every
        # auto-merged branch survives its own pull request while every branch a
        # human merged in the UI disappears — which reads exactly like the
        # setting being broken, and is not. Observed downstream: sixteen merged
        # branches still on the remote, all of them auto-merged, alongside two
        # human merges that had cleaned up correctly.
        #
        # `contents: write` above already covers the deletion; nothing else is
        # needed, and nothing about branch protection changes.
        #
        # The retry ladder exists for the GraphQL rate limit, which is hourly,
        # per-identity — and on the GITHUB_TOKEN path shared with the rest of
        # this repository's workflow runs. An
        # unattended run that opens a pull request every twenty minutes meets
        # it repeatedly, so a single failed arm is not an edge case. Retry with
        # backoff; when giving up, say WHEN the limit resets, because "try
        # again later" with no time is the least actionable message a 3am log
        # can hold. Any other error retries too — arming is idempotent, and a
        # transient API error looks identical from here.
        run: |
          set -u
          for delay in 15 30 60 120 0; do
            if gh pr merge --auto --merge "$PR_URL"; then
              exit 0
            fi
            if [ "$delay" -gt 0 ]; then
              echo "arm-auto-merge: failed; retrying in ${delay}s." >&2
              sleep "$delay"
            fi
          done
          echo "arm-auto-merge: giving up after 5 attempts." >&2
          reset="$(gh api rate_limit --jq .resources.graphql.reset 2>/dev/null || true)"
          if [ -n "$reset" ]; then
            echo "GraphQL rate limit resets at $(date -u -d "@$reset" +%H:%M:%SZ 2>/dev/null || echo "epoch $reset")." >&2
          fi
          exit 1

  # Delete the head branch once the pull request has actually merged.
  #
  # WHY THIS IS A JOB AND NOT A FLAG, WHICH IS WHAT WAS TRIED FIRST.
  #
  # Two mechanisms look like they already cover this, and neither does when the
  # merge is completed by auto-merge:
  #
  #   - the repository setting "Automatically delete head branches". Observed
  #     downstream: every pull request a HUMAN merged in the UI had its branch
  #     removed, and every one completed by auto-merge did not. Twenty-two
  #     branches accumulated that way against two that cleaned up correctly;
  #   - `gh pr merge --auto --delete-branch`. This was the first fix and it is a
  #     NO-OP. `gh` deletes the branch itself, after performing the merge — but
  #     with --auto it hands the merge to GitHub and returns immediately, so the
  #     deletion step it would have run never runs. It exits 0 and says nothing,
  #     which is how the fix looked correct for a whole release. The flag is
  #     gone from the step above rather than left as decoration.
  #
  # So the deletion is done here, keyed on the one event that is unambiguous:
  # the pull request closed AND merged. That is independent of who merged it,
  # how, and whether auto-merge was involved.
  #
  # A CLOSED-BUT-UNMERGED pull request keeps its branch. The work is unmerged by
  # definition, and deleting it would destroy the only copy over what is often a
  # temporary decision.
  delete-merged-branch:
    # Same-repository branches only: a fork's branch is not ours to delete.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete the merged head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # `|| true` on the delete, deliberately: the repository setting may have
        # got there first, and a race that leaves the branch already gone is the
        # desired end state, not a failure. Anything else prints and is visible
        # in the run.
        run: |
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"; then
            echo "Deleted $HEAD_REF."
          else
            echo "Could not delete $HEAD_REF — it may already be gone." >&2
          fi

  # Bring every OTHER open pull request up to date with the branch that just
  # merged.
  #
  # WHY THIS IS NOT HOUSEKEEPING. `setup-github.sh` sets
  # `strict_required_status_checks_policy: true` ("require branches to be up to
  # date"). Under that rule the moment ANY pull request merges, every other open
  # one becomes unmergeable however green it is. GitHub reports that as
  # `mergeStateStatus: BEHIND`, which NEVER APPEARS IN THE CHECKS LIST — so the
  # pull request shows a column of green ticks and simply does not merge, and
  # arming auto-merge does not help: observed directly, one merge flipped every
  # other open pull request to BEHIND while armed, and GitHub brought none of
  # them up to date on its own.
  #
  # This revisits ESC-17, whose recorded answer was to forbid queues. That is
  # right for an UNATTENDED run — deliver-phase.sh returns WAIT on any open pull
  # request, so the driver holds exactly one — and wrong for attended work,
  # where the cost lands on a human by hand, once per merge, per branch.
  #
  # IT NEVER FAILS. A genuine conflict is reported and left for a human rather
  # than turned into a red check on an innocent pull request that did nothing
  # wrong. The job exits 0 whatever it finds; what it found is in the summary.
  #
  # IT NEEDS A NON-DEFAULT TOKEN, and refuses rather than degrading. GitHub does
  # not create workflow runs from pushes made with GITHUB_TOKEN, so an update
  # pushed with it produces a new head commit that NO workflow ever runs against
  # — the branch comes up to date and its required checks are then permanently
  # missing, which is strictly worse than being BEHIND. With no App identity
  # this says so and does nothing.
  update-open-prs:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # Hoisted for the same reason as the job above: the secrets context is not
    # available in any `if:`, and referencing it there fails the whole FILE.
    env:
      APP_ID: ${{ secrets.APP_ID }}
    steps:
      - name: Mint the App token
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Update every other open pull request
        env:
          # No GITHUB_TOKEN fallback, deliberately — see the header above.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          MERGED: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            {
              echo "update-open-prs: no App identity, so nothing was updated."
              echo ""
              echo "An update pushed with GITHUB_TOKEN creates no workflow runs, so the"
              echo "branch would come up to date with its required checks permanently"
              echo "missing — worse than BEHIND. Run \`gh pr update-branch <n>\` by hand,"
              echo "or configure the App with \`scripts/setup-github.sh --app\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          OWNER="${REPO%%/*}"

          # This repository's branches only: a fork's branch is not ours to push.
          # BASE-SCOPED (ESC-71). "Up to date" is a fact about ONE base
          # branch: a merge into run/local leaves a pull request targeting
          # run/web exactly as current as it was. Updating it anyway rewrites
          # another lane's head, re-runs its whole CI, and can hand that lane a
          # conflict its own run never created — the twin-run isolation every
          # other part of this pipeline keeps, broken by the one job that
          # sweeps repo-wide.
          gh pr list --repo "$REPO" --state open --limit 200 --base "$BASE_REF" \
            --json number,headRefName,headRepositoryOwner \
            --jq ".[] | select(.headRepositoryOwner.login == \"$OWNER\") | \"\(.number)\t\(.headRefName)\"" \
            > /tmp/open-prs.txt || : > /tmp/open-prs.txt

          updated=0; conflicted=0; other=0
          while IFS="$(printf '\t')" read -r number ref; do
            [ -n "$number" ] || continue
            [ "$number" = "$MERGED" ] && continue
            if out="$(gh pr update-branch "$number" --repo "$REPO" 2>&1)"; then
              echo "update #$number ($ref)"
              updated=$((updated + 1))
            elif printf '%s' "$out" | grep -qi conflict; then
              echo "CONFLICT #$number ($ref) — left for a human, deliberately" >&2
              conflicted=$((conflicted + 1))
            else
              # "already up to date" lands here too, which is why this is not an
              # error: the desired end state, reached by someone else.
              echo "skip   #$number ($ref): $out"
              other=$((other + 1))
            fi
          done < /tmp/open-prs.txt

          echo "update-open-prs: base $BASE_REF — updated $updated, $conflicted conflicted, $other skipped." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # The backstop, and the only path that works with no token configured.
  #
  # Scheduled runs are not suppressed by the GITHUB_TOKEN rule, so this catches
  # every branch the close-event job could not — including everything already
  # accumulated before this workflow existed. It is periodic rather than
  # instant, which is the trade: a branch may outlive its merge by a day.
  #
  # Deletes ONLY a branch whose pull request actually merged, that lives in this
  # repository, and that no open pull request still refers to as head or base.
  # A closed-but-unmerged pull request keeps its branch: the work is unmerged by
  # definition and the branch is often the only copy of it.
  sweep-merged-branches:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete branches whose pull requests have merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"

          # Head branches of merged pull requests, this repository only — a
          # fork's branch is not ours to delete.
          gh pr list --repo "$REPO" --state merged --limit 200 \
            --json headRefName,headRepositoryOwner \
            --jq ".[] | select(.headRepositoryOwner.login == \"$OWNER\") | .headRefName" \
            | sort -u > /tmp/merged.txt

          # Anything an OPEN pull request still needs, as head or as base. A
          # stacked pull request based on another's branch would otherwise lose
          # its base the moment the lower one merged.
          gh pr list --repo "$REPO" --state open --limit 200 \
            --json headRefName,baseRefName \
            --jq '.[] | .headRefName, .baseRefName' \
            | sort -u > /tmp/inuse.txt

          deleted=0; skipped=0
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if [ "$branch" = "$DEFAULT_BRANCH" ]; then continue; fi
            if grep -qxF "$branch" /tmp/inuse.txt; then
              echo "keep   $branch — an open pull request still refers to it"
              skipped=$((skipped + 1)); continue
            fi
            # Already gone is the desired end state, not a failure.
            if ! gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then continue; fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
              echo "delete $branch"
              deleted=$((deleted + 1))
            else
              echo "FAILED $branch — check branch protection and token scope" >&2
            fi
          done < /tmp/merged.txt

          echo "sweep: deleted $deleted, kept $skipped in use." >> "$GITHUB_STEP_SUMMARY"
