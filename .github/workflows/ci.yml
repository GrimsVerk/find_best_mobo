name: CI

# Push triggers on ALL branches: agents work on branches and may push many
# commits before a PR exists; every pushed commit gets CI (AGENTS.md).
on:
  push:
  pull_request:

# Triggering on both push and pull_request means an open PR gets two runs per
# push. That duplication is deliberate (a branch gets CI before any PR exists),
# but a SUPERSEDED run is pure waste — it is testing a commit nobody will merge.
# Cancel in progress, keyed per workflow and ref, which matters most on the
# swift variant where every job is a macOS runner at ~10x the minute cost.
# The raw-block wrapper below is required: this file is a Jinja template, and
# Jinja would consume a dollar-brace-brace expression before GitHub ever saw it.
# The other workflows are copied verbatim and need no such wrapper. (Do not name
# the wrapper tag in a comment — Jinja reads it there too, and the comment opens
# a real block. That mistake renders a broken workflow that still looks fine in
# the template source.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mechanical precondition, not a code judgment: does this PR resolve to exactly
  # one plan? Kept a separate check from `review` on purpose — a red `plan` says
  # the branch/plan wiring is broken, where a red `review` would read as "the
  # reviewer rejected the code". Hard-fails: an estimate the reviewer never
  # receives is a gate that quietly stopped working. Branches with an exempt
  # prefix (chore/, docs/) pass without a plan. Always ubuntu — this is a text
  # match, and it must not sit behind a macOS runner on the Swift variant.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check reads the plan as it exists at the merge
          # base, and measures an exempt branch's size against it.
          fetch-depth: 0
      - name: Resolve the plan for this branch
        # GITHUB_HEAD_REF is the PR's source branch, set by Actions on
        # pull_request events. The base SHA is derived in the shell for the same
        # reason as in test-the-tests below: this file is a Jinja template, and
        # Jinja would consume a dollar-brace-brace expression before GitHub saw
        # it. Do not "simplify" this into the github.event.pull_request context.
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          PLAN="$(HEAD_REF="$GITHUB_HEAD_REF" BASE_SHA="$BASE_SHA" \
                  .github/scripts/plan-resolve.sh)"
          # An exempt branch resolves to no plan and has nothing to validate.
          [ -n "$PLAN" ] || exit 0
          # The plan must also be READABLE. A plan the parser cannot understand
          # produces no estimates and no file list, which reaches the reviewer
          # as an empty table it has been told to treat as ground truth — so it
          # fails here instead, where the message can say what to fix.
          git show "$BASE_SHA:$PLAN" | .github/scripts/plan-parse.sh >/dev/null
      - name: Every plan in the tree must parse
        # Separate from the step above, and not conditional on it: that one
        # reads only the plan THIS pull request resolves to, as it exists at the
        # base commit. A plan is written on one pull request and resolved by a
        # later one, so without this a malformed plan stays invisible until some
        # unrelated branch trips over it — and then the error names a document
        # that branch never touched. Runs for exempt branches too.
        run: .github/scripts/plan-lint.sh
      - name: Escape citations must resolve at the base commit
        # A gated document cites a docs/escapes.md entry by rigid id (ESC-<n>),
        # and only once that entry exists at the base — the review gate reads
        # documents at the base commit, so a citation to an unmerged entry is
        # false at the only moment anything checks it. Downstream that blocked
        # one pull request twice. Rigid ids are what make this checkable at
        # all: prose claims ("logged in docs/escapes.md") cannot be resolved
        # mechanically, which is why that version was never built.
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
            .github/scripts/escape-refs.sh
      - name: The escape ledgers are append-only
        # docs/escapes.md has said "never rewrite an entry" since it existed,
        # and the oracle ledger gets that promise ENFORCED — the asymmetry was
        # ESC-15. The escape ledger is the oracle's other evidence source, and
        # an agent editing an inconvenient row would change what a landed
        # decision's citation means. Corrections still pass: a correction is an
        # APPENDED row repeating the id, which is the file's own documented
        # lifecycle.
        #
        # It covers docs/escapes.done.md too, which records which escapes are
        # FINISHED. An append-only ledger cannot be edited to mark something
        # done, so that fact needed its own file — the same reason the backlog
        # has a done-log. A row there makes the delivery driver stop handing the
        # escape to the oracle, so the check additionally requires every closure
        # to name a path that exists: "closed, it is fine now" is refused.
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
            .github/scripts/escapes-append-only.sh
      - name: The backlog and its done-log are append-only
        # The backlog is the OTHER evidence source oracle-decisions.sh resolves
        # citations against, and it had no such protection — so an item could be
        # reworded after a decision cited it, by the same pipeline that wrote
        # both. Deliberately immutability rather than ownership: an unattended
        # planner files uncertainties here mid-run, and requiring the owner's
        # review on this path would stop work overnight, which is the failure
        # the whole arrangement exists to prevent. Filing stays free; rewriting
        # does not.
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
            .github/scripts/backlog-append-only.sh
      - name: Oracle decisions are append-only and evidence-backed
        # docs/DESIGN.oracle.md is the one design document an agent may write
        # unattended, so it is deliberately NOT behind CODEOWNERS — ownership
        # there would stop overnight work, which is the point of having it. This
        # check is what makes that safe: every decision cites evidence that
        # already landed, nothing already decided is revised, and each decision
        # names the docs/VISION.md statement it leaned on so the owner steers by
        # editing that statement rather than by arguing with each decision.
        #
        # Exits 0 with nothing to say on a project that has no oracle document,
        # rather than being skipped with an `if:` — a skipped job counts as
        # PASSING for a required check.
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
            .github/scripts/oracle-decisions.sh
      - name: The design and the vision are landed by their owner
        # Not CODEOWNERS twice over: that requires the owner's APPROVAL, which is
        # one click on a diff someone else composed. This requires the owner's
        # AUTHORSHIP of the pull request. If any agent can LAND docs/DESIGN.md,
        # docs/DESIGN.oracle.md has no reason to exist — an agent that can edit
        # the design does not need an evidence ledger.
        #
        # An agent may still write both documents and push the branch; what it
        # may not do is open the pull request. Plans, the oracle ledger and the
        # handoffs are untouched by this.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
          HEAD_SHA="$(git rev-parse HEAD)" \
            .github/scripts/owner-authored.sh
      - name: The vision must be finished before work is planned
        # Fires only on a pull request that adds or edits a plan, because that
        # is where implementation begins. The vision does NOT have to be written
        # before the design — writing it after is often easier, since by then
        # you know what the thing is — it only has to be done before anything is
        # planned against it. An unfilled docs/VISION.md otherwise fails
        # overnight rather than here: every oracle decision must quote a
        # statement from it.
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
          HEAD_SHA="$(git rev-parse HEAD)" \
            .github/scripts/vision-complete.sh
      - name: Unattended readiness (advisory)
        # ADVISORY, never red: `|| true` is the whole policy. The binding run
        # of this script is the delivery driver's preflight, where it REFUSES;
        # here it only surfaces repository-settings drift in the log, because
        # settings live outside every file a pull request can diff. Some lines
        # will read "cannot list" — the CI token cannot see secrets, and that
        # is expected here, not a finding.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/unattended-ready.sh || true
      - name: CODEOWNERS actually binds
        # NOT advisory, and the one part of the readiness check that belongs on
        # every pull request rather than only at dispatch.
        #
        # GitHub SILENTLY IGNORES a CODEOWNERS entry that does not resolve —
        # copier.yml warns about this in its own words: the rule "simply never
        # binds, and the gate paths quietly become writable by anything that
        # passes CI". Every deterministic protection in this repository rests on
        # that file resolving: the design and vision documents, the workflows,
        # the review prompt, the delivery machinery under .claude/. If the
        # handle goes stale — renamed account, removed collaborator — nothing
        # turns red and nothing says so. The last line of defence becomes the
        # LLM reviewer, which is a judgement gate, and auto-merge does the rest.
        #
        # This checks the PLATFORM's own validation rather than re-implementing
        # the path list, which would be a second copy of the carve-out logic in
        # plan-resolve.sh and would drift from it. One source of truth, one
        # extra API call.
        #
        # It fails only on a definite answer. An unreadable API is a note, not a
        # block: a check that goes red when GitHub is having a bad morning is a
        # check people learn to re-run without reading.
        # ?ref= and the numeric guard are ESC-48, propagated (ESC-57): without
        # the ref this validates the DEFAULT branch — which may not carry a
        # .github/ at all (a lane-based repository), so the endpoint 404s —
        # and gh prints the error body on STDOUT, so `2>/dev/null` does not
        # stop the JSON flowing into $errs and the step fails on garbage.
        # The head commit is the CODEOWNERS this pull request actually ships.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CO_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          errs="$(gh api "repos/${GITHUB_REPOSITORY}/codeowners/errors?ref=${CO_REF}" \
                    --jq '.errors | length' 2>/dev/null || true)"
          case "$errs" in *[!0-9]*|"") errs="";; esac
          if [ -z "$errs" ]; then
            echo "codeowners: cannot read the validation API here — not treating that as a failure."
          elif [ "$errs" = "0" ]; then
            echo "codeowners: resolves cleanly, so the ownership rules actually bind."
          else
            echo "codeowners: $errs unresolvable line(s) in .github/CODEOWNERS." >&2
            gh api "repos/${GITHUB_REPOSITORY}/codeowners/errors?ref=${CO_REF}" \
              --jq '.errors[] | "  line \(.line): \(.message)"' >&2 || true
            {
              echo ""
              echo "GitHub ignores a CODEOWNERS line it cannot resolve. It does not warn,"
              echo "and the paths that line was protecting become writable by anything that"
              echo "passes CI — including docs/DESIGN.md, the workflows, the review prompt,"
              echo "and the delivery machinery under .claude/. Nothing else here turns red."
              echo ""
              echo "Fix the handle, or remove the line deliberately if the person is gone."
            } >&2
            exit 1
          fi

  # The other half of the planning story. A `template/` branch is exempt from
  # the `plan` check above, because a template update is specified in the
  # TEMPLATE repository and no plan here can ever describe it. This is what
  # earns that exemption: it replays `copier update` from the base commit and
  # fails unless the result is byte-for-byte this pull request. Stronger than a
  # plan, which only says someone intended the change.
  #
  # Runs on every PR and exits 0 for non-template branches, rather than being
  # skipped with an `if:` — a skipped job counts as PASSING for a required
  # check, and a gate that can be silenced by naming a branch differently is
  # not a gate.
  template-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hoisted because the secrets context is not available in ANY `if:` — a
    # workflow that references it there fails validation and dies with zero
    # jobs (the ESC-36 shape). The step below tests the hoisted copy.
    env:
      APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check needs the base commit to replay from.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install copier
      - name: Which repository is the template
        # The token below must be scoped to exactly the template repository,
        # and only .copier-answers.yml knows which one that is.
        id: tpl
        run: |
          SRC="$(sed -n 's/^_src_path: *//p' .copier-answers.yml | tr -d "\"'" | head -1)"
          OWNERREPO="$(printf '%s' "$SRC" \
            | sed -E 's#^(gh:|https://github\.com/|ssh://git@[^/]+/|git@github\.com:)##; s#\.git$##')"
          echo "owner=${OWNERREPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${OWNERREPO##*/}"  >> "$GITHUB_OUTPUT"
      - name: Mint a read-only token for the template repository
        # Only needed when the template repository is private — the built-in
        # GITHUB_TOKEN is scoped to THIS repository and cannot read another
        # one. The token is minted from the same GitHub App the pipeline
        # already uses (APP_ID / APP_PRIVATE_KEY), down-scoped to
        # Contents: read on the template repository alone. Deliberately no PAT
        # fallback: a PAT expires — a year at most — and when it does,
        # template updates fail in EVERY generated project simultaneously,
        # while an App key does not expire (the owner's ruling).
        #
        # continue-on-error, deliberately: this job runs on every pull
        # request and exits 0 for non-template branches, so a mint that fails
        # (App not installed on the template repository yet) must not redden
        # unrelated pull requests. A template/ branch without a token still
        # fails CLOSED further down, with a message naming the fix.
        id: tpl-token
        if: env.APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.tpl.outputs.owner }}
          repositories: ${{ steps.tpl.outputs.repo }}
          permission-contents: read
      - name: Verify this is exactly what the template produces
        env:
          # The minted App token (empty when the mint was skipped or failed;
          # the script then runs tokenless, which works for a public template
          # and fails closed for a private one).
          TEMPLATE_TOKEN: ${{ steps.tpl-token.outputs.token }}
        run: |
          # Let git authenticate to GitHub with the token, if one is set.
          if [ -n "${TEMPLATE_TOKEN:-}" ]; then
            AUTH="https://x-access-token:${TEMPLATE_TOKEN}@github.com/"
            # --add on every write after the first. These all set the SAME key,
            # and a plain `git config` REPLACES a single-valued key instead of
            # appending — so without --add each write silently deletes the one
            # before it, leaving a single rewrite that matches nothing. Every
            # command still succeeds and the step exits 0; the only symptom is
            # copier's clone failing with "could not read Username" further
            # down, which reads like a missing token and is not one.
            git config --global       url."$AUTH".insteadOf "https://github.com/"
            git config --global --add url."$AUTH".insteadOf "git@github.com:"

            # A project generated before the HTTPS convention may have recorded
            # an ssh:// _src_path naming a personal host alias from someone's
            # ~/.ssh/config. No runner can resolve that, and the two rewrites
            # above do not match it — copier then dies on "Could not resolve
            # hostname", which reads like a credentials problem and is not one.
            # Rewrite whatever host it named straight to the authenticated
            # endpoint, so CI works regardless of the URL the project recorded.
            SRC="$(sed -n 's/^_src_path: *//p' .copier-answers.yml | tr -d "\"'" | head -1)"
            case "$SRC" in
              *ssh://git@*)
                ALIAS="$(printf '%s' "$SRC" | sed -E 's#^.*ssh://(git@[^/]+)/.*#\1#')"
                echo "template-sync: _src_path names '$ALIAS'; routing it through the token."
                git config --global --add url."$AUTH".insteadOf "ssh://${ALIAS}/"
                ;;
            esac
          fi
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
          HEAD_SHA="$(git rev-parse HEAD)" \
          HEAD_REF="$GITHUB_HEAD_REF" \
          .github/scripts/template-sync.sh

  # The success criteria, as scripts that run.
  #
  # docs/acceptance.md is the ONE artifact in an unattended run whose pull
  # request requires the owner's review, and until this job existed its evidence
  # was an agent's narration — "I ran X and it printed Y." Everywhere else this
  # template separates computed facts from judged verdicts; that table was the
  # one place narration was admitted as evidence, and it is the last thing the
  # owner reads. Every criterion docs/DESIGN.md §13 does not mark (owner) is
  # acceptance/S<n>.sh, and this runs them.
  #
  # ON EVERY PULL REQUEST rather than once at the acceptance pass, which is the
  # point: a criterion verified once and trusted thereafter is the "verified
  # once, trusted forever" shape this template distrusts everywhere else, and
  # one that regressed three merges later would be caught by nothing until the
  # next acceptance pass — which may be the last one.
  #
  # A SEPARATE JOB rather than a step in `plan`, for two reasons. These scripts
  # exercise the BUILT SYSTEM, so they need the project's toolchain installed,
  # which the text-matching `plan` job deliberately does not have. And a red
  # `acceptance-criteria` should read as "a success criterion is not met", never
  # as "the plan wiring is broken" — the same reason `plan` and `review` are
  # kept apart.
  #
  # The scripts are deliberately NOT CODEOWNERS-owned, on the owner's ruling: a
  # feature that depends on another would block waiting for a review, and a
  # failing criterion is diagnostic information the loop should act on rather
  # than a door it waits at. §13 IS owned, so the SET of criteria stays the
  # owner's even though the scripts are not.
  acceptance-criteria:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: §13, the acceptance table and the landed waivers are
          # all read at the merge base, never from this pull request's own copy.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Every scripted success criterion still holds
        # Exits 0 with nothing to say on a project whose design has no criteria
        # yet, rather than being skipped with an `if:` — a skipped job counts as
        # PASSING for a required check, which is the failure mode ci.yml already
        # takes care to avoid twice above.
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
            .github/scripts/acceptance-criteria.sh

  # Secret scanning belongs in CI, not only in a local hook. gitleaks runs in
  # pre-commit too, but pre-commit requires `pre-commit install` on every clone
  # — an agent working in a fresh worktree, or anyone who skipped that step,
  # bypasses it entirely. A committed credential is exactly the thing that must
  # not depend on someone having run a setup command.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull_request event the action lists the PR's commits through the API,
    # which the default read-only token cannot do — it answers 403 "Resource not
    # accessible by integration" and the job dies before scanning anything. That
    # is the worst failure shape available: the check is present, red, and has
    # scanned nothing. Ask for pull-requests read explicitly; contents must be
    # restated because naming any permission drops the rest to none.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still in the
          # repository, and still needs rotating.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # --locked, not a bare sync: it fails if uv.lock is missing or out of date
      # with pyproject.toml, rather than silently resolving something different
      # from what anyone tested locally. Commit uv.lock.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The ratchet's one seeded check (AGENTS.md): revert the implementation, keep
  # the new tests, and fail if the suite still passes — tests that pass without
  # the code under test are testing nothing.
  test-the-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check diffs the PR against its merge base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Tests must fail without the implementation
        # The SHAs are derived in the shell rather than from a GitHub Actions
        # expression on purpose: this file is a Jinja template, and Jinja would
        # consume a dollar-brace-brace expression before GitHub ever saw it.
        # Do not "simplify" this into the github.event.pull_request context.
        run: |
          BASE_SHA="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" \
          HEAD_SHA="$(git rev-parse HEAD)" \
          HEAD_REF="$GITHUB_HEAD_REF" \
          .github/scripts/test-the-tests.sh

