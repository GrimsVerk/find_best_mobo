name: Review

# Soft review gate. An independent, read-only LLM reviews the PR diff against
# AGENTS.md and docs/DESIGN.md and exits non-zero on any blocking finding. Mark
# the `review` job a REQUIRED status check so a red review blocks merge exactly
# like a failing test — but it is layered ON TOP of CI (the hard gate), never a
# replacement for it. Only runs on pull requests (it needs the base..head diff).
on:
  pull_request:

permissions:
  contents: read
  # The gate posts its verdict and findings as a pull request comment, against
  # the diff it judged. Before this, the reply existed only in a job log nobody
  # opens and was then discarded with the runner — so the one judged gate in the
  # pipeline was also the only one that left no reviewable trace.
  pull-requests: write

# One review per pull request head at a time. Without this, every push to a PR
# branch starts another review while the previous one is still running: the
# older run is judging a diff that no longer exists, and both draw on the same
# subscription budget as the workers that produced the change.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # A hung engine would otherwise sit on the runner for GitHub's six-hour
    # default with the pull request showing "in progress" the whole time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base and head commits are both present for the
          # base...head diff the review agent reviews.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Install the configured review engine. Default is claude; switch
      # REVIEW_ENGINE to codex once that engine's CI auth is wired (see below).
      - name: Install review engine
        env:
          REVIEW_ENGINE: claude
        run: |
          case "$REVIEW_ENGINE" in
            claude) npm install -g @anthropic-ai/claude-code ;;
            codex)  npm install -g @openai/codex ;;
            *) echo "unknown REVIEW_ENGINE: $REVIEW_ENGINE" >&2; exit 1 ;;
          esac
      - name: Headless review
        env:
          # Credentials come from a SUBSCRIPTION, not a metered API key.
          # claude: run `claude setup-token` once and store the result as the
          # CLAUDE_CODE_OAUTH_TOKEN secret (see README, manual setup). The metered
          # ANTHROPIC_API_KEY is only a fallback if you happen to have one.
          # Both are set unconditionally, so an unconfigured one arrives as the
          # empty string rather than being absent. review.sh unsets any empty
          # credential before invoking the engine — an empty ANTHROPIC_API_KEY
          # is not "no API key", it is an API key that fails to authenticate,
          # and it can take precedence over a perfectly good OAuth token.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # codex (FUTURE — not wired yet): must also run on a ChatGPT/Codex
          # SUBSCRIPTION, never a metered OPENAI_API_KEY. The Codex CLI keeps its
          # login in ~/.codex/auth.json; to enable this path, add a step before
          # this one that writes that file from a secret, then set REVIEW_ENGINE
          # to codex. Left unwired until a codex subscription is in use.
          REVIEW_ENGINE: claude
          # REVIEW_MODEL is optional. A different model than the workers is a
          # nice-to-have, not required — fresh context + read-only is the real
          # independence. Leave empty to use the subscription's default model.
          REVIEW_MODEL: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Which plan this PR is judged against is resolved from the branch
          # name (see .github/scripts/plan-resolve.sh).
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # Three facts the review PROMPT keys criteria on and the payload never
          # carried, so three criteria asked questions the reviewer had no way
          # to answer:
          #   1 — "is this exempt branch really carrying small work?" needs the
          #       branch prefix, and review.sh collapses "exempt" and "the plan
          #       check failed" into the same empty plan path, so the reviewer
          #       was offered a reading under which declining to judge was the
          #       reasonable move;
          #   2 — "were the tests written blind?" needs to know the change was
          #       orchestrated;
          #   5 — "block an AGENT-opened diff touching DESIGN/VISION" needs the
          #       author login, which is not a file and cannot be read out of
          #       the repository at any commit.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Where the gate leaves its evidence: the payload it was shown, the
          # reply it produced, the verdict, and the metadata tying them to a
          # commit. Collected at run end into docs/runs/ by
          # .claude/scripts/collect-evidence.sh.
          REVIEW_OUT_DIR: ${{ github.workspace }}/.review-out
          # The queue fact (.github/scripts/pr-queue.sh, ESC-17): what else this
          # author has open, and how much of it is red. Needs a token to list
          # pull requests and this pull request's own number so it can leave
          # itself out. Absent, the fact says it was not computed rather than
          # reporting an empty queue.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/review.sh

      # `always()`: the evidence is most valuable when the gate BLOCKED or died,
      # which are exactly the runs a success-conditional step would skip.
      - name: Keep what the gate was shown and what it said
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ github.workspace }}/.review-out
          # REQUIRED, because the path is dot-prefixed: upload-artifact@v4
          # excludes hidden files by default (since v4.4), so without this it
          # finds nothing under .review-out, warns, and uploads no artifact at
          # all — while the comment step right after it reads the same files
          # happily. Every review of the first unattended run was lost exactly
          # this way: five runs, five MISSING.md placeholders, zero artifacts.
          include-hidden-files: true
          if-no-files-found: warn
          # Ninety days is the platform default and it is not the retention
          # policy: collect-evidence.sh copies these into docs/runs/ at run end,
          # committed, on the owner's ruling — "i would rather risk gathering too
          # much data and deal with space issues, than getting stuck without the
          # info to get out of it." This artifact is the transport, not the
          # archive.
          retention-days: 90

      - name: Post the verdict against the diff it judged
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT: ${{ github.workspace }}/.review-out
        run: |
          [ -f "$OUT/reply.txt" ] || { echo "no reply to post"; exit 0; }
          verdict="$(cat "$OUT/verdict.txt" 2>/dev/null || echo UNKNOWN)"
          {
            echo "## Review gate — \`$verdict\`"
            echo
            echo "Judged \`${HEAD_SHA}\` against the base-commit rules, design and plan."
            echo "The full payload the reviewer was shown is in this run's"
            echo "\`review-${PR}-${HEAD_SHA}\` artifact."
            echo
            echo '<details><summary>Findings</summary>'
            echo
            echo '```'
            # Capped so a long reply cannot exceed GitHub's comment limit and
            # lose the whole comment. The artifact holds the untruncated text.
            head -c 55000 "$OUT/reply.txt"
            echo
            echo '```'
            echo
            echo '</details>'
          } > "$OUT/comment.md"
          gh pr comment "$PR" --body-file "$OUT/comment.md" \
            || echo "could not post the comment — the artifact still has it"

