# Every lever the pipeline has, flat top-level keys named after the Config
# fields. Values here mirror the in-code defaults; a key removed from this file
# falls back to its default rather than crashing. Reasoning for the numbers
# lives in docs/DESIGN.md (R17, R24 and the excerpt-window decision).

channel_url = "https://www.youtube.com/@ActuallyHardcoreOverclocking"
start_date = 2023-01-01
data_dir = "data"

# The hand-authored alias table. INPUT, not cache — which is why it is a path of
# its own rather than something under `data_dir`: pointing the cache elsewhere
# must not move the table with it (docs/DESIGN.oracle.md OD-11, R1007). A full
# path to the file, relative to the working directory, like every other path
# here.
alias_table_path = "aliases.toml"

# Classification: at or below this duration a video is a Short, and excluded.
shorts_max_seconds = 120

# Selection: minimum normalized alias mentions in the body (title hits bypass).
mention_threshold = 3

# Excerpting: asymmetric window, wide first — the verdict follows the analysis.
window_before_seconds = 120
window_after_seconds = 300
per_video_excerpt_cap = 10

# Bundling and batching.
bundle_token_cap = 24000
calibration_batch_size = 12
batch_count = 3
chars_per_token = 4.0

# Halt triggers for transcript fetching (docs/DESIGN.md R24).
consecutive_fetch_error_limit = 3
fetch_error_rate_limit = 0.03
missing_caption_rate_limit = 0.05

# Stage B extraction (docs/DESIGN.md §7, R9). Which model reads a bundle and
# writes its claims.
#
# **The value is not a choice made here.** `docs/DESIGN.md` §6 fixes it by
# owner ruling — "Opus 5 throughout, low effort for per-excerpt extraction" —
# and `docs/DECISIONS.md`'s 2026-08-14 entry rules the same, with reasoning
# effort as the cost lever rather than the model. §7 states the reason: this is
# reading comprehension, not reasoning. `extract.py` fixes the effort at `low`
# for that ruling and this key carries the model.
#
# It is a key rather than a constant because R17 makes the cost levers
# configuration, and because the calibration record names the model it
# measured — a chars-per-token factor measured against one model does not
# transfer to another. There is deliberately no default in code: `extract`
# refuses before calling anything if this is empty, so an unset value costs a
# message rather than money.
extraction_model = "claude-opus-5"
